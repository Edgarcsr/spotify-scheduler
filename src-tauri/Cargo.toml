[package]
name = "spotify-scheduler"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
# Só rlib: staticlib/cdylib servem para mobile e, com LTO, cada um refazia o link inteiro no CI.
name = "spotify_scheduler_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["net", "time", "io-util", "sync"] }
chrono = "0.4.45"
sha2 = "0.11.0"
base64 = "0.23.1"
url = "2.5.8"
thiserror = "2.0.21"
tauri-plugin-notification = "2.5.1"
tauri-plugin-single-instance = "2.5.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"] }
getrandom = "0.4.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# LTO "thin" + 16 codegen units: link bem mais rápido no CI, exe um pouco maior que com LTO "fat".
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
