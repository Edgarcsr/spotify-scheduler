name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Tags não enxergam o cache umas das outras, só o da branch padrão. Quem mantém esse
      # cache é o workflow "Warm cache" (warm-cache.yml) na master; aqui só restauramos.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # WiX (.msi) e NSIS (setup.exe) que o bundler do Tauri baixa a cada build.
      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-tools-${{ runner.os }}-v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Spotify Scheduler ${{ env.RELEASE_TAG }}"
          releaseBody: "Baixe o instalador (setup.exe ou .msi) abaixo para instalar o Spotify Scheduler, ou a versão portátil (portable.exe), que roda sem instalar."
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: false

      - name: Upload portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PORTABLE="spotify-scheduler_${VERSION}_x64-portable.exe"
          cp src-tauri/target/release/spotify-scheduler.exe "$PORTABLE"
          gh release upload "$RELEASE_TAG" "$PORTABLE" --clobber
